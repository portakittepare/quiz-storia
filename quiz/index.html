<title>Quiz di storia – Roma e le guerre puniche</title>
<style>
:root{
  --bg:#f6efe3; --card:#fffdf8; --ink:#2a2622; --soft:#7a6f63; --line:#e6dccb;
  --terra:#b5502f; --terra-d:#8f3d22; --blu:#2f5d7c; --ok:#3f8f5a; --mid:#d39a1f; --ko:#c2463a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%;}
body{
  background:var(--bg); color:var(--ink);
  font-family: "Iowan Old Style", "Palatino", "Book Antiqua", Georgia, serif;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  -webkit-user-select:none; user-select:none;
}
.wrap{max-width:820px; margin:0 auto;}
header{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
header .titolo{font-size:15px; letter-spacing:.12em; text-transform:uppercase; color:var(--terra-d); font-family:-apple-system, "Helvetica Neue", sans-serif; font-weight:700;}
.screen{display:none;}
.screen.on{display:block; animation:fade .35s ease;}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.card{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:22px; box-shadow:0 2px 0 var(--line);}
h1{font-size:34px; line-height:1.1; margin:6px 0 6px; color:var(--terra-d);}
.lead{color:var(--soft); font-size:18px; margin:0 0 18px;}
.ui{font-family:-apple-system, "Helvetica Neue", sans-serif;}
.label{font-family:-apple-system, "Helvetica Neue", sans-serif; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); margin:18px 0 8px;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{font-family:-apple-system, "Helvetica Neue", sans-serif; font-size:16px; border:2px solid var(--line); background:#fff; color:var(--ink); padding:10px 14px; border-radius:999px; cursor:pointer;}
.chip.on{border-color:var(--terra); background:#fbe9df; color:var(--terra-d); font-weight:700;}
.btn{font-family:-apple-system, "Helvetica Neue", sans-serif; font-size:19px; font-weight:700; border:none; border-radius:16px; padding:16px 22px; cursor:pointer; background:var(--terra); color:#fff; box-shadow:0 4px 0 var(--terra-d); }
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--terra-d);}
.btn.sec{background:#fff; color:var(--blu); border:2px solid var(--blu); box-shadow:0 4px 0 #c9d6e0;}
.btn.sec:active{box-shadow:0 1px 0 #c9d6e0;}
.btn.wide{width:100%;}
.btn:disabled{opacity:.4;}
.row{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
.hero{display:flex; align-items:center; gap:18px;}
.hero .lupo{width:150px; flex:none;}
.lupo svg{width:100%; height:auto; display:block;}
.storico{font-family:-apple-system, "Helvetica Neue", sans-serif; font-size:14px; color:var(--soft); margin-top:16px; line-height:1.6;}

/* domanda */
.top{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.bar{flex:1; height:12px; background:#eadfcd; border-radius:99px; overflow:hidden;}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--terra),#d27a4f); border-radius:99px; transition:width .4s;}
.count{font-family:-apple-system, "Helvetica Neue", sans-serif; font-weight:700; color:var(--soft); font-size:15px; min-width:62px; text-align:right;}
.topic{font-family:-apple-system, "Helvetica Neue", sans-serif; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--blu); margin-bottom:6px;}
.q{font-size:25px; line-height:1.3; margin:0 0 16px;}
.opts{display:grid; gap:10px;}
.opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; font-family:inherit; font-size:20px; line-height:1.3; background:#fff; color:var(--ink); border:2px solid var(--line); border-radius:16px; padding:14px 16px; cursor:pointer; min-height:62px;}
.opt .k{flex:none; width:34px; height:34px; border-radius:50%; background:#f1e7d8; color:var(--terra-d); font-family:-apple-system, "Helvetica Neue", sans-serif; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:16px;}
.opt.ok{border-color:var(--ok); background:#e7f4ea;}
.opt.ok .k{background:var(--ok); color:#fff;}
.opt.ko{border-color:var(--ko); background:#fbe7e4;}
.opt.ko .k{background:var(--ko); color:#fff;}
.opt.dim{opacity:.5;}
.opt:disabled{cursor:default;}
.hintbox{font-family:-apple-system, "Helvetica Neue", sans-serif; margin-top:12px; font-size:16px; color:#6b5520; background:#fdf3d7; border:1px dashed #e0c472; border-radius:12px; padding:10px 12px; display:none;}
.feedback{display:none; margin-top:16px; align-items:flex-start; gap:14px; border-radius:18px; padding:14px; border:2px solid var(--line); background:#fff;}
.feedback.on{display:flex; animation:fade .3s ease;}
.feedback .lupo{width:110px; flex:none;}
.feedback .msg{font-family:-apple-system, "Helvetica Neue", sans-serif; font-weight:800; font-size:20px; margin-bottom:4px;}
.feedback .exp{font-size:17px; line-height:1.4;}
.feedback.bene{border-color:var(--ok);} .feedback.bene .msg{color:var(--ok);}
.feedback.cosi{border-color:var(--mid);} .feedback.cosi .msg{color:#a2740f;}
.feedback.male{border-color:var(--ko);} .feedback.male .msg{color:var(--ko);}

/* risultati */
.score{font-size:58px; font-weight:800; color:var(--terra-d); line-height:1; font-family:-apple-system, "Helvetica Neue", sans-serif;}
.score small{font-size:22px; color:var(--soft);}
.tally{font-family:-apple-system, "Helvetica Neue", sans-serif; display:flex; gap:10px; margin:12px 0 4px; flex-wrap:wrap;}
.tally span{padding:6px 12px; border-radius:99px; font-weight:700; font-size:15px;}
.t-b{background:#e7f4ea; color:var(--ok);} .t-c{background:#fdf3d7; color:#a2740f;} .t-m{background:#fbe7e4; color:var(--ko);}
.err{border-top:1px solid var(--line); padding:12px 0; font-size:17px; line-height:1.4;}
.err b{color:var(--ok);}
.err .tu{color:var(--ko);}

/* animazioni lupo */
.anim-bene{animation:salta .7s ease 2;}
.anim-cosi{animation:dondola 1s ease 1;}
.anim-male{animation:giu .8s ease 1;}
.anim-ciao{animation:dondola 2.4s ease-in-out infinite;}
@keyframes salta{0%,100%{transform:translateY(0)} 40%{transform:translateY(-14px)} 60%{transform:translateY(0)} 75%{transform:translateY(-5px)}}
@keyframes dondola{0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)}}
@keyframes giu{0%{transform:translateY(0)} 50%{transform:translateY(6px) scale(.97)} 100%{transform:translateY(2px)}}
@media (max-width:560px){ h1{font-size:28px} .q{font-size:21px} .opt{font-size:18px} .hero .lupo{width:110px} .feedback .lupo{width:80px} }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="chip" href="../" style="text-decoration:none">☰ Menu</a><span class="titolo">Storia · Roma repubblicana</span></header>

  <!-- INIZIO -->
  <section id="s-inizio" class="screen on">
    <div class="card">
      <div class="hero">
        <div class="lupo anim-ciao" id="lupo-inizio"></div>
        <div>
          <h1>Ciao Nora!</h1>
          <p class="lead">Sono il lupetto della storia. Vediamo quanto ne sai di Roma, Cartagine e Annibale?</p>
        </div>
      </div>
      <div class="label">Argomento</div>
      <div class="chips" id="c-arg"></div>
      <div class="label">Quante domande</div>
      <div class="chips" id="c-num"></div>
      <div class="row"><button class="btn wide" id="b-via">Inizia il quiz</button></div>
      <div class="storico" id="storico"></div>
    </div>
  </section>

  <!-- DOMANDA -->
  <section id="s-domanda" class="screen">
    <div class="top">
      <button class="chip" id="b-esci" aria-label="Torna all'inizio">✕</button>
      <div class="bar"><i id="bar"></i></div>
      <div class="count" id="count"></div>
    </div>
    <div class="card">
      <div class="topic" id="topic"></div>
      <p class="q" id="q"></p>
      <div class="opts" id="opts"></div>
      <div class="hintbox" id="hint"></div>
      <div class="row" id="r-hint"><button class="btn sec" id="b-hint">💡 Aiutino</button></div>
      <div class="feedback" id="fb">
        <div class="lupo" id="lupo-fb"></div>
        <div><div class="msg" id="fb-msg"></div><div class="exp" id="fb-exp"></div></div>
      </div>
      <div class="row"><button class="btn wide" id="b-avanti" style="display:none">Avanti →</button></div>
    </div>
  </section>

  <!-- RISULTATI -->
  <section id="s-fine" class="screen">
    <div class="card">
      <div class="hero">
        <div class="lupo" id="lupo-fine"></div>
        <div>
          <div class="score" id="score"></div>
          <div class="ui" style="font-size:22px; font-weight:800; margin-top:6px" id="giudizio"></div>
          <div class="tally" id="tally"></div>
        </div>
      </div>
      <div class="row">
        <button class="btn" id="b-errori">Ripassa gli errori</button>
        <button class="btn sec" id="b-nuovo">Nuovo quiz</button>
      </div>
      <div class="label" id="l-err">Da ripassare</div>
      <div id="errori"></div>
    </div>
  </section>
</div>

<script>
/* ---------- Il lupetto: 4 espressioni ---------- */
function lupo(umore){
  // umore: 'ciao' | 'bene' | 'cosi' | 'male'
  const pelo='#8d97a6', peloS='#6f7a8a', crema='#f4eee4', rosa='#f2b3b8', occhio='#2b2b33';
  let orecchie, occhi, sopracciglia='', bocca, extra='';
  const oreSu = `
    <path d="M52 70 L40 14 L92 48 Z" fill="${peloS}"/><path d="M58 60 L50 28 L82 50 Z" fill="${rosa}"/>
    <path d="M148 70 L160 14 L108 48 Z" fill="${peloS}"/><path d="M142 60 L150 28 L118 50 Z" fill="${rosa}"/>`;

['C','Dove ottenne Roma la prima grande vittoria navale, nel 260 a.C.?','Milazzo',['Egadi','Zama','Canne'],'In Sicilia, vicino a Messina.','Grazie ai corvi, nel 260 a.C. Roma vinse nelle acque di Milazzo.'],
['C','Che cos’era una quinquereme?','Una nave con cinque file di rematori',['Un’unità di cinque legioni','Una tassa di un quinto','Una catapulta a cinque bracci'],'«Quinque» = cinque.','Roma varò 100 quinqueremi e 20 triremi.'],

['C','Quale fu la prima provincia romana?','La Sicilia',['La Sardegna e la Corsica','La Gallia Cisalpina','La Spagna'],'L’isola contesa nella Prima guerra punica.','La Sicilia, governata da un magistrato; gli abitanti, senza cittadinanza, pagavano un contributo annuo.'],
['C','Quale fu la seconda provincia romana (235 a.C., secondo il libro)?','Sardegna e Corsica',['Sicilia','Macedonia','Acaia'],'Due isole insieme.','Cartagine, senza soldi né flotta, dovette rinunciarvi.'],
['C','Di che cosa fu accusato Verre, governatore della Sicilia, nel processo di Cicerone?','Di concussione',['Di tradimento','Di omicidio','Di furto di elefanti'],'Il reato del pubblico ufficiale che si fa dare denaro.','Verre (73-71 a.C.) fu accusato dai Siciliani di concussione.'],
['C','Come definì Polibio la Prima guerra punica?','«La più lunga, ininterrotta e tremenda»',['«La più breve e facile»','«Una vittoria di Pirro»','«La guerra del sale»'],'Durò più di vent’anni.','Per Polibio fu la più lunga, ininterrotta e tremenda guerra conosciuta.'],
['C','Quale terza provincia nacque dopo le vittorie sui Galli del 225 e 222 a.C.?','La Gallia Cisalpina',['La Provenza','La Macedonia','L’Illiria'],'Corrisponde alla pianura Padana.','Roma occupò Milano, fondò Cremona e Piacenza e fece della Gallia Cisalpina la terza provincia.'],

['A','Perché Amilcare Barca portò i Cartaginesi in Spagna?','Per le ricche miniere d’oro e d’argento',['Per vendicarsi dei Galli','Per fondare una nuova capitale','Per allearsi con Pirro'],'Cartagine doveva pagare i debiti di guerra.','L’oro e l’argento spagnoli servivano a risollevare le finanze e a pagare Roma.'],
['A','Quale fiume segnava il confine tra le zone romana e cartaginese in Spagna?','L’Ebro',['Il Rodano','Il Ticino','Il Tago'],'Lo stesso dell’omonimo delta spagnolo.','Dal 226 a.C. l’Ebro divideva le due aree d’influenza.'],
['A','Qual era il legame tra Amilcare, Annibale e Asdrubale?','Amilcare era il padre; Annibale e Asdrubale fratelli',['Annibale era il padre di Amilcare','Asdrubale era il padre di Annibale','Erano tre generali senza parentela'],'Sono tutti della famiglia Barca.','Annibale successe al padre Amilcare e lasciò il fratello Asdrubale al comando in Spagna.'],
['A','Quale città distrusse Annibale nel 219 a.C., dando il pretesto alla guerra?','Sagunto',['Cartagena','Capua','Siracusa'],'Alleata di Roma in Spagna.','Sagunto era fedele alleata di Roma: nel 218 Roma dichiarò guerra.'],
['A','Quale catena montuosa attraversò Annibale per arrivare in Italia?','Le Alpi (dopo i Pirenei)',['Gli Appennini','Il Caucaso','I Balcani'],'A fine settembre, con il freddo.','Superati i Pirenei, varcò le Alpi con circa 50.000 uomini e 37 elefanti.'],
['A','Con quanti elefanti, secondo il libro, iniziò la traversata delle Alpi?','37',['3','137','370'],'Più di trenta.','Annibale partì con quasi 50.000 soldati e 37 elefanti; arrivarono circa 30.000 uomini.'],
['A','Quali furono le prime vittorie di Annibale in Italia?','Ticino e Trebbia (218), Trasimeno (217)',['Canne e Zama','Milazzo ed Egadi','Eraclea e Ascoli Satriano'],'Due fiumi e un lago.','Prima i fiumi Ticino e Trebbia, poi il lago Trasimeno.'],
['A','Perché Quinto Fabio Massimo fu detto «il Temporeggiatore»?','Evitava lo scontro diretto e bloccava i rifornimenti',['Arrivava sempre in ritardo','Fece una tregua lunghissima','Costruì un grande orologio'],'Prendere tempo…','La sua tattica attendista logorava Annibale senza rischiare battaglie.'],
['A','Che cosa accadde a Canne nel 216 a.C.?','Annibale vinse con un doppio accerchiamento',['Roma vinse la guerra','Annibale fu catturato','Scipione conquistò Cartagena'],'Vicino a Barletta.','Circa 50.000 caduti romani e 20.000 prigionieri; molte città del Sud passarono con Cartagine.'],
['A','Quale re si alleò con Annibale dopo Canne?','Filippo V di Macedonia',['Antioco III di Siria','Pirro','Massinissa'],'Voleva l’Illiria.','Filippo V offrì il suo aiuto in cambio di campo libero in Illiria: iniziarono le guerre macedoniche.'],
['A','Qual fu il «grave errore» di Annibale?','Invece di puntare su Roma, attaccò la Campania e restò bloccato a Capua',['Tornò subito in Africa','Lasciò gli elefanti in Spagna','Si alleò con i Galli'],'Diede tempo ai Romani.','Bloccato a Capua e senza aiuti, permise a Roma di riorganizzarsi.'],
['A','Quale città cadde nel 212 a.C. nonostante le macchine di Archimede?','Siracusa',['Capua','Taranto','Cartagena'],'La città di Archimede.','Siracusa cadde nel 212 a.C.; Capua fu ripresa l’anno dopo.'],
['A','Che cosa conquistò Scipione in Spagna, a soli 24 anni?','Cartagena (Carthago Nova)',['Sagunto','Numanzia','Cadice'],'La «nuova Cartagine».','Conquistò la capitale della Spagna cartaginese; la sua clemenza gli portò l’appoggio delle tribù.'],
['A','Dove e quando Scipione sconfisse Annibale?','A Zama, nel 202 a.C.',['A Canne, nel 216 a.C.','Alle Egadi, nel 241 a.C.','A Pidna, nel 168 a.C.'],'In Africa, nell’attuale Tunisia.','Dopo Zama Scipione fu detto «l’Africano».'],
['A','Come neutralizzò Scipione gli elefanti a Zama?','Li spaventò con frecce, trombe e grida',['Li catturò con le reti','Li avvelenò','Usò i corvi'],'Fece molto rumore.','Gli elefanti impazziti fecero più danni ai Cartaginesi che ai Romani.'],
['A','Quale fu una condizione della pace dopo Zama?','Pagare 10.000 talenti d’argento e consegnare la flotta (tranne 10 navi)',['Cedere la Sicilia a Roma','Distruggere Cartagine','Consegnare Annibale vivo'],'Un risarcimento enorme e quasi niente navi.','Cartagine perse anche i territori fuori dall’Africa e non poteva fare guerre senza il permesso di Roma.'],
['A','Perché Roma vinse la Seconda guerra punica?','Riserva inesauribile di uomini e consenso degli alleati',['Aveva gli elefanti','Aveva mercenari migliori','Annibale si arrese subito'],'Il «sentire insieme».','Da 4 legioni a 24 nel 211, circa 200.000 uomini; e gli alleati, quasi tutti, restarono fedeli.'],
['A','Da dove deriva la parola «consenso»?','Dal latino cum-sentire, «sentire insieme»',['Dal greco thymos, «ira»','Dal latino consulere, «deliberare»','Dal latino censere, «contare»'],'Cum = con.','Il «sentire comune» creato da Roma con gli alleati fu decisivo.'],

['O','Perché dopo Zama Roma si volse verso Siria e Macedonia?','Erano regni ricchi e potevano allearsi con Cartagine',['Per vendicare Pirro','Per trovare nuovi mercenari','Perché avevano attaccato Roma'],'Due motivi: ricchezza e pericolo.','Le mire espansionistiche erano spinte da tutti: aristocrazia, mercanti e popolo.'],
['O','Quando si combatté la Prima guerra macedonica?','215-205 a.C.',['200-197 a.C.','171-168 a.C.','149-146 a.C.'],'Durante la Seconda guerra punica.','Filippo V si era alleato con Annibale; senza il suo aiuto fu sconfitto.'],
['O','Chi chiese aiuto a Roma all’inizio della Seconda guerra macedonica (200 a.C.)?','Il Regno di Pergamo e Rodi',['Atene e Sparta','Cartagine','I Galli'],'Un regno e un’isola.','Erano stanchi degli assedi di Filippo V e di Antioco III.'],
['O','Che cosa annunciò Flaminio ai giochi istmici di Corinto?','Che le poleis greche erano libere',['Che la Grecia diventava provincia','Che Cartagine doveva essere distrutta','Che Annibale era morto'],'Fu un’illusione.','In realtà i Greci avevano solo cambiato padrone.'],
['O','Chi era Antioco III?','Il re di Siria, sconfitto alle Termopili e a Magnesia',['Il re di Macedonia sconfitto a Pidna','Il re di Numidia','Un console romano'],'Annibale si rifugiò da lui.','Sconfitto alle Termopili (191) e a Magnesia (190); pace del 188 a.C.'],
['O','Come morì Annibale (183 a.C.)?','Bevve il veleno per non cadere nelle mani dei Romani',['Cadde a Zama','Fu giustiziato a Roma','Morì di vecchiaia a Cartagine'],'Lo racconta Cornelio Nepote.','Non volendo morire per mano di nessuno, bevve il veleno che portava sempre con sé.'],
['O','Dove fu sconfitto Perseo nel 168 a.C.?','A Pidna',['A Magnesia','Alle Termopili','A Corinto'],'Nella Macedonia meridionale.','Con Pidna finì la Terza guerra macedonica; nel 146 la Macedonia divenne provincia.'],
['O','Che cosa accadde in Grecia nel 146 a.C.?','Corinto fu rasa al suolo e la Grecia divenne la provincia di Acaia',['Atene fu distrutta','Sparta conquistò Roma','Nacque la Lega latina'],'Solo Atene restò libera.','Atene, sempre fedele, fu ricompensata con la libertà.'],
['O','Chi diceva in Senato «Carthago delenda est»?','Marco Porcio Catone',['Scipione l’Africano','Fabio Massimo','Cicerone'],'Un celebre oratore.','«Cartagine dev’essere distrutta»: Catone temeva la ripresa economica di Cartagine.'],
['O','Quale fu il pretesto della Terza guerra punica?','Cartagine attaccò Massinissa, re di Numidia alleato di Roma',['Cartagine distrusse Sagunto','Cartagine ospitò Annibale','Cartagine occupò Messina'],'Un re africano.','Nel 151 a.C. Cartagine attaccò senza il consenso di Roma, violando il trattato.'],
['O','Chi rase al suolo Cartagine nel 146 a.C.?','Publio Cornelio Scipione Emiliano',['Scipione l’Africano','Marco Porcio Catone','Tito Quinzio Flaminio'],'Il figlio adottivo dell’Africano.','Scipione Emiliano, detto «Secondo Africano»; i superstiti furono venduti come schiavi.'],
['O','Quale città dei Celtiberi fu distrutta nel 133 a.C.?','Numanzia',['Sagunto','Cartagena','Corinto'],'In Spagna.','Scipione Emiliano distrusse Numanzia; il Mediterraneo era ormai mare nostrum.'],
['O','Come chiamavano i Romani il Mediterraneo dopo il 133 a.C.?','Mare nostrum',['Mare internum Punicum','Oceanus','Mare Graecum'],'«Il nostro mare».','Roma era la più grande potenza del Mediterraneo.'],
['O','Quale regno Roma ereditò perché il sovrano morì senza eredi?','Il Regno di Pergamo',['Il Regno di Macedonia','La Numidia','La Siria'],'In Asia Minore.','Roma divenne erede del Regno di Pergamo e di buona parte dell’Asia Minore.'],

['X','Che cosa gridò, secondo Livio, il gallo Brenno gettando la spada sulla bilancia?','«Vae victis!» (Guai ai vinti!)',['«Veni, vidi, vici»','«Carthago delenda est»','«Alea iacta est»'],'Riguarda i vinti.','Mentre si pesava l’oro del riscatto (390 a.C.).'],
['X','Che cosa disse Maarbale ad Annibale dopo Canne?','«Sai vincere, ma non sai sfruttare la vittoria»',['«Hai vinto, ora torna a casa»','«La fortuna aiuta gli audaci»','«Il dado è tratto»'],'Annibale non marciò su Roma.','In latino: «Vincere scis, Hannibal, victoria uti nescis».'],
['X','Dove morì Asdrubale, il fratello di Annibale, nel 207 a.C.?','Al fiume Metauro',['A Zama','A Canne','Al lago Trasimeno'],'Nelle Marche.','Portava rinforzi ad Annibale: la sua sconfitta lo lasciò senza aiuti.'],
['X','Quale strada fece costruire Appio Claudio Cieco?','La via Appia',['La via Flaminia','La via Emilia','La via Aurelia'],'Porta il suo nome.','La «regina delle strade», da Roma a Capua e poi fino a Brindisi.'],
['X','Chi vinse a Milazzo nel 260 a.C.?','Il console Gaio Duilio',['Scipione l’Africano','Attilio Regolo','Furio Camillo'],'Fu celebrato con una colonna con i rostri.','La colonna rostrata era ornata con gli speroni delle navi nemiche.']
];

/* ---------- Stato ---------- */
const LS='quiz_storia_nora_v1';
let scelta={arg:'tutti', num:15};
let giro=[], i=0, aiutoUsato=false, esiti=[], ultimiErrori=[];

function mescola(a){ a=a.slice(); for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]];} return a; }
function $(id){return document.getElementById(id);}
function vai(s){ document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on')); $(s).classList.add('on'); window.scrollTo(0,0); }
function leggi(){ try{ return JSON.parse(localStorage.getItem(LS)||'[]'); }catch(e){ return []; } }
function scrivi(v){ try{ localStorage.setItem(LS, JSON.stringify(v.slice(-30))); }catch(e){} }

const FRASI={
  bene:['Bravissima!','Esatto, ululato di gioia!','Perfetto!','Ottimo, Nora!','Giusto! Il lupetto approva.'],
  cosi:['Giusto… ma con l’aiutino!','Ci sei, con una spintarella.','Quasi da sola: bene così così!'],
  male:['Ahi, non era questa.','Uffa! Riproviamo dopo.','Niente paura: si ripassa.','Sbagliato… il lupetto è triste.']
};
function frase(t){ const a=FRASI[t]; return a[Math.floor(Math.random()*a.length)]; }

/* ---------- Schermata iniziale ---------- */
function chips(){
  const ca=$('c-arg'); ca.innerHTML='';
  const voci=[['tutti','Tutto']].concat(Object.keys(ARG).map(k=>[k,ARG[k]]));
  voci.forEach(([k,t])=>{
    const n = k==='tutti'?D.length:D.filter(d=>d[0]===k).length;
    const b=document.createElement('button'); b.className='chip'+(scelta.arg===k?' on':''); b.textContent=t+' ('+n+')';
    b.onclick=()=>{scelta.arg=k; chips();}; ca.appendChild(b);
  });
  const cn=$('c-num'); cn.innerHTML='';
  [[10,'10'],[15,'15'],[25,'25'],[0,'Tutte']].forEach(([n,t])=>{
    const b=document.createElement('button'); b.className='chip'+(scelta.num===n?' on':''); b.textContent=t;
    b.onclick=()=>{scelta.num=n; chips();}; cn.appendChild(b);
  });
  const st=leggi();
  if(st.length){
    const ult=st.slice(-5).reverse().map(r=>`${r.data} · ${r.arg}: <b>${r.punti}/${r.tot}</b>`).join('<br>');
    $('storico').innerHTML='<b>Ultimi quiz</b><br>'+ult;
  } else $('storico').textContent='';
}
function inizia(lista){
  giro=lista; i=0; esiti=[];
  vai('s-domanda'); domanda();
}
$('b-via').onclick=()=>{
  let pool = scelta.arg==='tutti'? D : D.filter(d=>d[0]===scelta.arg);
  pool=mescola(pool);
  if(scelta.num) pool=pool.slice(0,scelta.num);
  inizia(pool);
};
$('b-esci').onclick=()=>{ vai('s-inizio'); metti('lupo-inizio','ciao','ciao'); chips(); };

/* ---------- Domanda ---------- */
function domanda(){
  const d=giro[i]; aiutoUsato=false;
  $('bar').style.width=(i/giro.length*100)+'%';
  $('count').textContent=(i+1)+' / '+giro.length;
  $('topic').textContent=ARG[d[0]];
  $('q').textContent=d[1];
  $('hint').style.display='none'; $('hint').textContent='💡 '+d[4];
  $('r-hint').style.display='flex'; $('b-hint').disabled=false;
  $('fb').className='feedback'; $('b-avanti').style.display='none';
  const opts=mescola([d[2]].concat(d[3]));
  const box=$('opts'); box.innerHTML='';
  opts.forEach((t,n)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<span class="k">${'ABCD'[n]}</span><span></span>`; b.lastChild.textContent=t;
    b.onclick=()=>rispondi(b,t); box.appendChild(b);
  });
}
$('b-hint').onclick=()=>{ aiutoUsato=true; $('hint').style.display='block'; $('b-hint').disabled=true; };

function rispondi(btn,t){
  const d=giro[i]; const giusto = t===d[2];
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const testo=b.lastChild.textContent;
    if(testo===d[2]) b.classList.add('ok'); else if(b===btn) b.classList.add('ko'); else b.classList.add('dim');
  });
  const esito = giusto ? (aiutoUsato?'cosi':'bene') : 'male';
  esiti.push({d, esito, data:t});
  $('r-hint').style.display='none';
  const fb=$('fb'); fb.className='feedback on '+esito;
  metti('lupo-fb', esito, esito);
  $('fb-msg').textContent=frase(esito);
  $('fb-exp').textContent=(giusto?'':'Risposta giusta: '+d[2]+'. ')+d[5];
  const av=$('b-avanti'); av.style.display='block'; av.textContent = (i===giro.length-1)?'Vedi il risultato →':'Avanti →';
  setTimeout(()=>fb.scrollIntoView({behavior:'smooth', block:'nearest'}),80);
}
$('b-avanti').onclick=()=>{ i++; if(i<giro.length) domanda(); else fine(); };

/* ---------- Risultati ---------- */
function fine(){
  $('bar').style.width='100%';
  const b=esiti.filter(e=>e.esito==='bene').length, c=esiti.filter(e=>e.esito==='cosi').length, m=esiti.filter(e=>e.esito==='male').length;
  const tot=esiti.length; const punti=b + c*0.5; const perc=punti/tot;
  const umore = perc>=0.8?'bene' : perc>=0.55?'cosi':'male';
  vai('s-fine'); metti('lupo-fine', umore, umore);
  $('score').innerHTML=`${(Math.round(punti*10)/10).toString().replace('.',',')}<small> / ${tot}</small>`;
  $('giudizio').textContent = umore==='bene' ? 'Preparatissima! Il lupetto ulula di gioia.' : umore==='cosi' ? 'Così così: ci sei quasi, ripassa gli errori.' : 'Male stavolta: rileggi gli appunti e riprova!';
  $('giudizio').style.color = umore==='bene'?'var(--ok)':umore==='cosi'?'#a2740f':'var(--ko)';
  $('tally').innerHTML=`<span class="t-b">😊 ${b} bene</span><span class="t-c">😐 ${c} con aiutino</span><span class="t-m">😢 ${m} sbagliate</span>`;
  ultimiErrori=esiti.filter(e=>e.esito!=='bene').map(e=>e.d);
  const el=$('errori'); el.innerHTML='';
  esiti.filter(e=>e.esito!=='bene').forEach(e=>{
    const r=document.createElement('div'); r.className='err';
    r.innerHTML=`<div></div><div>✔ <b></b></div>${e.esito==='male'?'<div class="tu">✘ </div>':''}`;
    r.children[0].textContent=e.d[1]; r.children[1].lastChild.textContent=e.d[2];
    if(e.esito==='male') r.children[2].append(e.data);
    el.appendChild(r);
  });
  $('l-err').style.display = ultimiErrori.length?'block':'none';
  $('b-errori').style.display = ultimiErrori.length?'inline-block':'none';
  const st=leggi(); const oggi=new Date();
  st.push({data:oggi.toLocaleDateString('it-IT'), arg: scelta.arg==='tutti'?'Tutto':ARG[scelta.arg], punti:(Math.round(punti*10)/10).toString().replace('.',','), tot});
  scrivi(st);
}
$('b-errori').onclick=()=>inizia(mescola(ultimiErrori));
$('b-nuovo').onclick=()=>{ vai('s-inizio'); metti('lupo-inizio','ciao','ciao'); chips(); };

/* ---------- Avvio ---------- */
metti('lupo-inizio','ciao','ciao'); chips();
</script>
